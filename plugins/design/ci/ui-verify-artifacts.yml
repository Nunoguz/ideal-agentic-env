# ui-verify screenshots and the Playwright report, kept as review evidence (design).
- name: Upload ui-verify screenshots and the Playwright report
  if: always()
  uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
  with:
    name: ui-verify
    path: |
      {{DIR}}/artifacts/ui/
      {{DIR}}/playwright-report/
    if-no-files-found: ignore
    retention-days: 14
