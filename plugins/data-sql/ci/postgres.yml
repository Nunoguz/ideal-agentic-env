# PostgreSQL for integration tests in `verify --full` (data-sql). Pinned by digest; match the major
# version the project runs in production.
postgres:
  image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
  env:
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_DB: app
  ports:
    - 5432:5432
  options: >-
    --health-cmd "pg_isready -U postgres"
    --health-interval 5s
    --health-timeout 5s
    --health-retries 12
