# Pin registry. This workflow never runs a step. It lists the actions that only shipped content uses
# (CI lines that plugin scaffold scripts generate), so Dependabot proposes updates for them as well.
# `npm run sync` copies every pin in .github/workflows/ into the plugin templates and scaffold scripts,
# and `npm run validate` fails when a shipped pin drifts from here (scripts/pins.mjs).
name: action-pins

on:
  workflow_dispatch:

permissions: {}

jobs:
  registry:
    name: Pin registry (never runs)
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
