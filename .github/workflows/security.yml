# Managed by governance 0.2.0 (ideal-agentic-env). /governance:setup --refresh updates this file while it is unedited; edit it and setup leaves it alone. sha256:43bf4cc42d34937a
name: security

# Law layer (ideal-agentic-env/governance). Runs without GitHub Advanced Security, so it works on
# private repositories on every plan. One ubuntu job keeps Actions minutes low. Every scanner is
# pinned by version AND sha256; bump them deliberately (governance README, "Updating scanners").
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly: new advisories for dependencies that did not change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_SCANNER_VERSION: "2.7.1"
  OSV_SCANNER_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
  SYFT_VERSION: "1.57.0"
  SYFT_SHA256: "9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704"
  SEMGREP_VERSION: "1.184.0"
  # The dependency policy (license allowlist, blocking severity) lives in .claude/ideal-agentic-env.json under
  # "governance", because it is the project's decision and this workflow is a managed file (ADR-0008).

jobs:
  scan:
    name: secrets, SAST, dependencies, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVENT: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pinned scanners (sha256-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          fetch() { curl -fsSL --retry 3 -o "$1" "$2"; echo "$3  $1" | sha256sum -c -; }
          fetch gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256"
          tar -xzf gitleaks.tar.gz -C "$bin" gitleaks
          fetch osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" "$OSV_SCANNER_SHA256"
          install -m 0755 osv-scanner "$bin/osv-scanner"
          fetch syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" "$SYFT_SHA256"
          tar -xzf syft.tar.gz -C "$bin" syft
          pipx install "semgrep==${SEMGREP_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"

      # PRs scan only what they add, except when they change the scanners or their exceptions: then the
      # whole repository and its history are scanned, so adopting the workflow surfaces old findings
      # before merge instead of turning the default branch red afterwards.
      - name: Choose scan scope
        run: |
          scope=full
          if [ "$EVENT" = "pull_request" ]; then
            scope=incremental
            if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -qxE '\.github/workflows/security\.yml|\.gitleaks\.toml|\.gitleaksignore|\.semgrepignore|osv-scanner\.toml'; then
              scope=full
            fi
          fi
          echo "SCAN_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "Scan scope: $scope"

      - name: Secrets in git history (gitleaks)
        if: ${{ !cancelled() }}
        run: |
          if [ "$SCAN_SCOPE" = "incremental" ]; then
            gitleaks git --no-banner --redact --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            gitleaks git --no-banner --redact --exit-code 1 .
          fi

      - name: Static analysis (semgrep)
        if: ${{ !cancelled() }}
        run: |
          if [ "$SCAN_SCOPE" = "incremental" ]; then
            semgrep scan --config p/default --metrics=off --error --quiet --baseline-commit "$BASE_SHA"
          else
            semgrep scan --config p/default --metrics=off --error --quiet
          fi

      # One OSV-Scanner run for vulnerabilities and licenses. The gate script applies the policy: CVSS >= 7.0,
      # malicious packages and unknown severities fail; lower severities are reported in the job summary.
      - name: Dependencies and licenses (osv-scanner, governance policy)
        if: ${{ !cancelled() }}
        run: node .github/scripts/dependency-gate.mjs

      - name: SBOM (syft, SPDX JSON)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: syft . -o spdx-json=sbom.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

  # Scheduled runs keep one open "[vulnerability-report]" issue listing the findings that do not block, so
  # they are tracked until fixed. Only this job may write issues.
  vulnerability-report:
    name: track non-blocking vulnerabilities
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned osv-scanner (sha256-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/osv-scanner" "$bin/osv-scanner"
          echo "$bin" >> "$GITHUB_PATH"
      - run: node .github/scripts/dependency-gate.mjs --report-issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
