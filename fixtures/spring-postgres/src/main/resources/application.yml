spring:
  application:
    name: library
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
library:
  lending:
    max-loans: 3
